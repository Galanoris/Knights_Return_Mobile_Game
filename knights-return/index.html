<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator too (insets are handled in CSS + ViewportFit.ts) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: "Add to Home Screen" launches without browser UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Knight's Return" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Knight's Return</title>
    <style>
      :root {
        /* Safe areas (notch, rounded corners, home indicator). The canvas is full-bleed;
           the HUD, touch buttons and overlays are inset by these (read in systems/ViewportFit.ts). */
        --sa-top: env(safe-area-inset-top, 0px);
        --sa-right: env(safe-area-inset-right, 0px);
        --sa-bottom: env(safe-area-inset-bottom, 0px);
        --sa-left: env(safe-area-inset-left, 0px);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        /* The game's own background colour, so a 1px rounding edge or thin bar is never black */
        background: #1a1a2e;
        overflow: hidden;
        /* Stop Safari from scrolling, rubber-banding, zooming or selecting while thumbs are on the screen */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Fill the dynamic viewport (it follows the browser toolbars on phones).
         No flex centering: Phaser's autoCenter already offsets the canvas. */
      body { width: 100dvw; height: 100dvh; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; }

      /* Portrait on a phone: cover the game (ViewportFit.ts also freezes it) */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 30;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: var(--sa-top) var(--sa-right) var(--sa-bottom) var(--sa-left);
        background: #1a1a2e; color: #ffdd00; font: 16px monospace; text-align: center;
      }
      #rotate .phone {
        width: 28px; height: 46px; border: 3px solid #ffdd00; border-radius: 6px;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }

      /* One-time iOS hint (ui/InstallHint.ts) */
      #install-hint {
        position: fixed; left: 50%; bottom: calc(var(--sa-bottom) + 10px); transform: translateX(-50%);
        z-index: 20; display: flex; align-items: center; gap: 10px;
        max-width: calc(100vw - var(--sa-left) - var(--sa-right) - 24px);
        padding: 8px 8px 8px 12px; border: 1px solid #ffdd00; border-radius: 6px;
        background: rgba(10, 10, 24, 0.9); color: #ffffff; font: 12px/1.4 monospace;
        transition: opacity 0.35s;
      }
      #install-hint b { color: #ffdd00; }
      #install-hint button {
        flex: none; width: 30px; height: 30px; border: 0; border-radius: 4px;
        background: rgba(255, 255, 255, 0.14); color: #ffffff; font: 14px monospace;
      }
      #install-hint.hide { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="rotate"><div class="phone" aria-hidden="true"></div>Please rotate your device</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
